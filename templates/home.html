{% load static %}

<html>
    <head>
        <link rel="stylesheet" href="{% static 'css/main.css' %}">

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9"
            crossorigin="anonymous">
    </head>

    <body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

        <!-- SVG ICONS -->
        <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">

            <symbol id="checkmark" viewBox="0 0 16 16">
                <path d="M12.736 3.97a.733.733 0 0 1 1.047 0c.286.289.29.756.01 1.05L7.88 12.01a.733.733 0 0 1-1.065.02L3.217 8.384a.757.757 0 0 1 0-1.06.733.733 0 0 1 1.047 0l3.052 3.093 5.4-6.425a.247.247 0 0 1 .02-.022Z"/>
            </symbol>

            <symbol id="cancel" viewBox="0 0 16 16">
                <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854Z"/>
            </symbol>

            <symbol id="pencil" viewBox="0 0 16 16">
                <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10z"/>
            </symbol>

            <symbol id="trash3" viewBox="0 0 16 16">
                <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5Z"/>
            </symbol>

            <symbol id="plus" viewBox="0 0 16 16">
                <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
            </symbol>

        </svg>

        <h1>Students:</h1>

        <!-- ADD BUTTON -->
        <button
            class="btn"
            hx-get="{% url 'add_student' %}"
            hx-target="#query_result tbody"
            hx-swap="afterbegin">

            <svg class="bi bi-plus" width="32" height="32">
                <use xlink:href="#plus"></use>
            </svg>

        </button>

        <!-- STUDENT LIST -->
        <div
            id="query_result"
            hx-target="this"
            hx-swap="innerHTML"
            hx-get="{% url 'get_student_list' %}"
            hx-trigger="load delay:1s">

        </div>

        <!-- SPINNER -->
        <div class="d-flex justify-content-center">

            <div
                id="spinner"
                class="spinner-border htmx-indicator"
                role="status">

                <span class="sr-only"></span>

            </div>

        </div>

        <!-- HTMX -->
        <script
            src="https://unpkg.com/htmx.org@1.9.2"
            integrity="sha384-L6OqL9pRWyyFU3+/bjdSri+iIphTN/bvYyM37tICVyOJkWZLpP2vGn6VUEXgzg6h"
            crossorigin="anonymous">
        </script>

        <!-- BOOTSTRAP -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3"
            crossorigin="anonymous">
        </script>

        <!-- JQUERY -->
        <script
            src="https://code.jquery.com/jquery-3.6.1.min.js"
            integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ="
            crossorigin="anonymous">
        </script>

    </body>
</html>
