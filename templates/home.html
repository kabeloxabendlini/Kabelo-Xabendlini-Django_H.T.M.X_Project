{% load static %}
<html>
<head>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <style>
        body { background: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .app-header { background: #fff; border-bottom: 1px solid #e9ecef; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .app-header h1 { font-size: 1.25rem; font-weight: 600; color: #1a1a2e; margin: 0; }
        .app-header .subtitle { font-size: 0.8rem; color: #6c757d; margin: 0; }
        .main-content { padding: 2rem; }
        .card-panel { background: #fff; border-radius: 12px; border: 1px solid #e9ecef; padding: 1.5rem; }
        .card-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
        .card-panel-header h2 { font-size: 1rem; font-weight: 600; color: #1a1a2e; margin: 0; }
        .btn-add { background: #4f46e5; color: #fff; border: none; border-radius: 8px; padding: 0.5rem 1rem; font-size: 0.875rem; font-weight: 500; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: background 0.15s; }
        .btn-add:hover { background: #4338ca; color: #fff; }
        .table thead th { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #6c757d; border-bottom: 1px solid #e9ecef; padding: 0.75rem 1rem; background: #f8f9fa; }
        .table tbody td { padding: 0.85rem 1rem; vertical-align: middle; border-bottom: 1px solid #f1f3f5; font-size: 0.9rem; color: #374151; }
        .table tbody tr:last-child td { border-bottom: none; }
        .table tbody tr:hover td { background: #f8f9ff; }
        .avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
        .avatar-placeholder { width: 38px; height: 38px; border-radius: 50%; background: #e0e7ff; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 600; color: #4f46e5; }
        .badge-gender { font-size: 0.75rem; padding: 0.25rem 0.6rem; border-radius: 20px; font-weight: 500; }
        .badge-male { background: #dbeafe; color: #1d4ed8; }
        .badge-female { background: #fce7f3; color: #be185d; }
        .badge-other { background: #f3e8ff; color: #7c3aed; }
        .btn-icon { width: 32px; height: 32px; border-radius: 6px; border: 1px solid #e9ecef; background: #fff; display: inline-flex; align-items: center; justify-content: center; color: #6c757d; cursor: pointer; transition: all 0.15s; font-size: 15px; }
        .btn-icon.edit:hover { background: #eff6ff; border-color: #bfdbfe; color: #3b82f6; }
        .btn-icon.delete:hover { background: #fef2f2; border-color: #fecaca; color: #ef4444; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: flex; }
        .form-control, .form-select { font-size: 0.85rem; border-radius: 6px; border: 1px solid #d1d5db; padding: 0.4rem 0.65rem; }
        .form-control:focus, .form-select:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
        .btn-save { color: #059669; border: none; background: none; padding: 0; cursor: pointer; font-size: 20px; transition: color 0.15s; display: inline-flex; align-items: center; }
        .btn-save:hover { color: #047857; }
        .btn-cancel { color: #6c757d; border: none; background: none; padding: 0; cursor: pointer; font-size: 20px; transition: color 0.15s; display: inline-flex; align-items: center; }
        .btn-cancel:hover { color: #374151; }
    </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
    <symbol id="checkmark" viewBox="0 0 16 16">
        <path d="M12.736 3.97a.733.733 0 0 1 1.047 0c.286.289.29.756.01 1.05L7.88 12.01a.733.733 0 0 1-1.065.02L3.217 8.384a.757.757 0 0 1 0-1.06.733.733 0 0 1 1.047 0l3.052 3.093 5.4-6.425a.247.247 0 0 1 .02-.022Z"/>
    </symbol>
    <symbol id="cancel" viewBox="0 0 16 16">
        <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854Z"/>
    </symbol>
    <symbol id="pencil" viewBox="0 0 16 16">
        <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/>
    </symbol>
    <symbol id="trash3" viewBox="0 0 16 16">
        <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5ZM11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H2.506a.58.58 0 0 0-.01 0H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1h-.995a.59.59 0 0 0-.01 0H11Zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5h9.916Zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47ZM8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5Z"/>
    </symbol>
    <symbol id="plus" viewBox="0 0 16 16">
        <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
    </symbol>
</svg>

<div class="app-header">
    <div>
        <h1>Student Registry</h1>
        <p class="subtitle">Manage student records</p>
    </div>
    <button class="btn-add"
            hx-get="{% url 'add_student' %}"
            hx-target="#query_result"
            hx-swap="afterbegin">
        <svg width="16" height="16"><use xlink:href="#plus"></use></svg>
        Add student
    </button>
</div>

<div class="main-content">
    <div class="card-panel">
        <div class="card-panel-header">
            <h2>All students</h2>
            <div id="spinner" class="spinner-border spinner-border-sm text-secondary htmx-indicator" role="status"></div>
        </div>
        <div id="query_result"
             hx-target="this"
             hx-swap="innerHTML"
             hx-get="{% url 'get_student_list' %}"
             hx-trigger="load delay:300ms"
             hx-indicator="#spinner">
        </div>
    </div>
</div>

<script src="https://unpkg.com/htmx.org@1.9.2" integrity="sha384-L6OqL9pRWyyFU3+/bjdSri+iIphTN/bvYyM37tICVyOJkWZLpP2vGn6VUEXgzg6h" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.6.1.min.js" integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ=" crossorigin="anonymous"></script>
<script>
    document.body.addEventListener('htmx:afterSwap', function(e) {
        if (e.detail.target.id === 'query_result') {
            var btn = document.querySelector('.btn-add');
            btn.setAttribute('hx-target', '#student-table-body');
            htmx.process(btn);
        }
    });
</script>
</body>
</html>
