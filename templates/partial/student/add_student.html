<tr style="background:#f8f9ff;">
    <td>
        <span class="avatar-placeholder">?</span>
    </td>
    <td>{{ form.first_name }}{{ form.first_name.errors }}</td>
    <td>{{ form.last_name }}{{ form.last_name.errors }}</td>
    <td>{{ form.gender }}{{ form.gender.errors }}</td>
    <td>{{ form.age }}{{ form.age.errors }}</td>
    <td>{{ form.major }}{{ form.major.errors }}</td>
    <td>
        {{ form.profile_image }}
        {{ form.profile_image.errors }}
    </td>
    <td style="white-space:nowrap;">
        <a href="#"
           hx-post="{% url 'add_student_submit' %}"
           hx-target="closest tr"
           hx-swap="outerHTML"
           hx-include="closest tr"
           hx-encoding="multipart/form-data"
           class="btn-save me-2" title="Save">
            <svg width="20" height="20"><use xlink:href="#checkmark"></use></svg>
        </a>
        <a href="#"
           hx-get="{% url 'add_student_cancel' %}"
           hx-target="closest tr"
           hx-swap="outerHTML"
           class="btn-cancel" title="Cancel">
            <svg width="20" height="20"><use xlink:href="#cancel"></use></svg>
        </a>
    </td>
</tr>
