<tr>
    <td>{{ student.first_name }}</td>
    <td>{{ student.last_name }}</td>
    <td>{{ student.gender }}</td>
    <td>{{ student.age }}</td>
    <td>{{ student.major }}</td>

    <td>
        {% if student.profile_image %}
            <img src="{{ student.profile_image.url }}"
                 alt="{{ student.first_name }}'s photo"
                 style="width: 50px;
                        height: 50px;
                        object-fit: cover;
                        border-radius: 50%;">
        {% else %}
            <span class="text-muted">No image</span>
        {% endif %}
    </td>

    <!-- EDIT -->
    <td>
        <button class="btn"
                hx-get="{% url 'edit_student' student.pk %}"
                hx-target="closest tr"
                hx-swap="outerHTML">

            <svg class="bi bi-pencil"
                 width="32"
                 height="32">
                <use xlink:href="#pencil"></use>
            </svg>
        </button>
    </td>

    <!-- DELETE -->
    <td>
        <button class="btn"
                hx-confirm="Are you sure?"
                hx-target="closest tr"
                hx-swap="outerHTML swap:1s"
                hx-delete="{% url 'delete_student' student.pk %}">

            <svg class="bi bi-trash3"
                 width="32"
                 height="32">
                <use xlink:href="#trash3"></use>
            </svg>
        </button>
    </td>
</tr>
